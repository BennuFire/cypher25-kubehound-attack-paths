# The APA test cluster: KubeHound's cluster (same name, so its setup scripts still work), with
# 7 workers instead of 2 and room for 250 pods per node (kubelet default is 110).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubehound.test.local
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    maxPods: 250
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
  - role: worker
  - role: worker
  - role: worker
  - role: worker
